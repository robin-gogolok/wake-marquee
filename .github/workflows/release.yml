name: Release

# Publishes on a version tag, authenticated by OIDC trusted publishing rather
# than a stored token. Set this up once at npmjs.com → the package → Settings →
# Trusted Publisher, pointing at this repository and this workflow file. npm
# then accepts short-lived credentials minted for this exact workflow run, and
# attaches a provenance attestation automatically. There is no NPM_TOKEN to
# leak, rotate, or accidentally print into a log.
#
# The trusted publisher can only be configured once the package exists, so the
# very first publish is a manual `npm publish` from a laptop.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+. Node 24 bundles a new enough npm
      # today, but the bundled version moves with the runtime and a silent
      # fallback to token auth would be worse than an explicit upgrade.
      - run: npm install -g npm@^11.5.1

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

      # A version already on the registry is not an error. The first release is
      # published by hand, and its tag is pushed afterwards; this keeps that run
      # green instead of failing on a duplicate publish.
      - name: Is this version already published?
        id: check
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VER is already on npm, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public
